<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Glass Light Blue Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>

    <!-- Glyph Blue Gradient matching Dashboard -->
    <linearGradient id="logoGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="3" y="3" width="94" height="94" rx="28" fill="url(#logoBgGrad)" stroke="#BFDBFE" stroke-width="2.5" />
  
  <!-- Reken Glyph: Vertical Rounded Capsule in Dashboard Blue -->
  <rect x="25" y="25" width="22" height="50" rx="11" fill="url(#logoGlyphGrad)" />

  <!-- Reken Glyph: Circular Head in Dashboard Blue -->
  <circle cx="68" cy="36" r="11" fill="url(#logoGlyphGrad)" />
</svg>
